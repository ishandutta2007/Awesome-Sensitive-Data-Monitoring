<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="scannerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes scan {
      0% { transform: translateX(-600px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateX(1200px); opacity: 0.2; }
    }
    @keyframes pulseNode {
      0%, 100% { r: 6px; opacity: 0.6; }
      50% { r: 10px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    }
    @keyframes textGlow {
      0%, 100% { opacity: 0.9; }
      50% { opacity: 1; filter: drop-shadow(0 0 10px #818cf8); }
    }
    @keyframes floatShield {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .scan-beam { animation: scan 4s ease-in-out infinite; }
    .node-1 { animation: pulseNode 3s ease-in-out infinite; }
    .node-2 { animation: pulseNode 3s ease-in-out 1s infinite; }
    .node-3 { animation: pulseNode 3s ease-in-out 2s infinite; }
    .title-glow { animation: textGlow 4s ease-in-out infinite; }
    .shield-anim { animation: floatShield 5s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Grid Pattern overlay -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="50" x2="1200" y2="50" /><line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="150" x2="1200" y2="150" /><line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="250" x2="1200" y2="250" /><line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="100" y1="0" x2="100" y2="400" /><line x1="200" y1="0" x2="200" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" /><line x1="400" y1="0" x2="400" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" /><line x1="600" y1="0" x2="600" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" /><line x1="800" y1="0" x2="800" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" /><line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
  </g>

  <!-- Network / Security Circuit Connections -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M 150 100 L 250 100 L 300 160 L 450 160" />
    <path d="M 950 100 L 850 100 L 800 160 L 650 160" />
    <path d="M 200 300 L 320 300 L 380 240 L 500 240" />
    <path d="M 1000 300 L 880 300 L 820 240 L 700 240" />
  </g>

  <!-- Animated Nodes -->
  <circle cx="250" cy="100" r="8" fill="#38bdf8" class="node-1" />
  <circle cx="300" cy="160" r="8" fill="#818cf8" class="node-2" />
  <circle cx="950" cy="100" r="8" fill="#c084fc" class="node-3" />
  <circle cx="800" cy="160" r="8" fill="#38bdf8" class="node-1" />
  <circle cx="380" cy="240" r="8" fill="#c084fc" class="node-2" />
  <circle cx="820" cy="240" r="8" fill="#818cf8" class="node-3" />

  <!-- Scanning Beam Effect -->
  <rect x="0" y="0" width="300" height="400" fill="url(#scannerGrad)" class="scan-beam" />

  <!-- Floating Shield Icon Center Top -->
  <g class="shield-anim" transform="translate(560, 45)">
    <path d="M 40 0 L 80 15 V 45 C 80 75 40 95 40 95 C 40 95 0 75 0 45 V 15 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#glow)" />
    <!-- Lock Emblem -->
    <rect x="28" y="45" width="24" height="20" rx="3" fill="#38bdf8" />
    <path d="M 33 45 V 36 C 33 31 47 31 47 36 V 45" fill="none" stroke="#38bdf8" stroke-width="3" />
  </g>

  <!-- Main Title & Subtitle -->
  <g text-anchor="middle">
    <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#accentGrad)" class="title-glow" filter="url(#glow)">
      Awesome Sensitive Data Monitoring
    </text>
    <text x="600" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
      Curated Ecosystem of DSPM Platforms, Data Scanners, PII Discovery &amp; Secret Governance
    </text>
  </g>

  <!-- Tag Pills -->
  <g transform="translate(240, 275)">
    <!-- Pill 1: DSPM -->
    <rect x="0" y="0" width="130" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="65" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#38bdf8" text-anchor="middle">🛡️ Cloud DSPM</text>

    <!-- Pill 2: PII Classification -->
    <rect x="150" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="235" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#818cf8" text-anchor="middle">🔍 PII Discovery</text>

    <!-- Pill 3: Secret Detection -->
    <rect x="340" y="0" width="170" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-width="1.5" />
    <text x="425" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle">🔑 Secret Detection</text>

    <!-- Pill 4: Data Governance -->
    <rect x="530" y="0" width="190" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="625" y="22" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">📊 Risk Governance</text>
  </g>

  <!-- Footer Stats / Meta -->
  <text x="600" y="360" font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    SaaS Enterprise Platforms &amp; Top Open-Source Repositories • 2026 Edition
  </text>
</svg>
